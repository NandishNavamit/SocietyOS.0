services:
  postgres:
    image: postgres:17
    container_name: society-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: society_db
      POSTGRES_USER: society_user
      POSTGRES_PASSWORD: society_password
      TZ: Asia/Kolkata
    command: postgres -c timezone=Asia/Kolkata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U society_user -d society_db"]
      interval: 10s
      timeout: 5s
      retries: 10


  adminer:
    image: adminer:latest
    container_name: society-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((int)!@fsockopen(\"127.0.0.1\", 8080));'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
