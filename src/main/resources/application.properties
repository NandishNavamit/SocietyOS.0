spring.application.name=Society
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/society_db}
spring.datasource.username=${DB_USERNAME:society_user}
spring.datasource.password=${DB_PASSWORD:society_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:development-only-change-this-secret-before-production-1234567890}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_TOKEN_DAYS:7}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}


app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Email is opt-in. With APP_MAIL_ENABLED=false, invitations are still created and can be copied from the manager workspace.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# Mail delivery is optional in the prototype. Do not mark an otherwise usable
# application unhealthy merely because SMTP has intentionally not been enabled.
management.health.mail.enabled=${APP_MAIL_ENABLED:false}
